[package]
name = "pysgx"
description = "Python bindings of the SGX545 tooling: decoders, encoders, sgx-asm, the simulator"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
usse-isa = { path = "../usse-isa" }
pds-isa = { path = "../pds-isa" }
sgx-sim = { path = "../sgx-sim" }
sgx-tools = { path = "../sgx-tools" }
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py311"] }

[build-dependencies]
pyo3-build-config = "0.30.1"
