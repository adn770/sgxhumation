#
# Texture sampling. Round 3 of the ISA probes (2026-10-22). r20-r23 hold the four texture state
# words of a 16x16 linear B8G8R8A8 texture (as libsgxfive's copy source: point sampling,
# stride 64 bytes) at the scratch buffer + 0x1000, whose dword i is 0xD0000000 | i, so texel
# (x, y) reads 0xD0000400 + 16y + x; r24/r25 hold the coordinates divided by 16.

[[probe]]
name = "smp-point"
question = "smp: operands, coordinates, addressing at the edge, LOD modes with 0"
source = "dump.s"
params = { A = 0, B = 0, C = 0, D = 0, E = 0, F = 0, G = 0, H = 0, OUT = "r10" }
inputs = ["OP", "A", "B", "C", "D", "E", "F", "G", "H"]
labels = ["smp2d at texel coordinates (0.5, 0.5)", "smp2d at texel coordinates (3.5, 5.5)", "smp2d at texel coordinates (3.0, 5.0)", "smp2d at texel coordinates (2.99, 4.99)", "smp2d at texel coordinates (15.5, 15.5)", "smp2d at texel coordinates (17.5, 2.5)", "smp2d at texel coordinates (-1.5, 3.5)", "smp2d at texel coordinates (56.0, 88.0)", "smp1d at (3.5, 5.5)", "smp2dbias with 0 at (3.5, 5.5)", "smp2dreplace with 0 at (3.5, 5.5)", "smp2dgrad with 0 at (3.5, 5.5)", "smp2d .flt16 coordinates (3.5, 5.5) in one register"]
