[probe.hypotheses]
"normalized coordinates (source 0, source 0 + 1), point sampled at floor(u * width), clamped to the edge; the texel as stored; the four state words from source 1 on" = [[0xd0000400], [0xd0000453], [0xd0000453], [0xd0000442], [0xd00004ff], [0xd000042f], [0xd0000430], [0xd00004ff], [0xd0000403], [0xd0000453], [0xd0000453], [0xd0000453], [0xd0000453]]
