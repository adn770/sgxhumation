#
# Float dot products (fdp, fdpc, fddp, fddpc) and the internal registers. Round 1 of the ISA
# probes (2026-10-22). Generated once; the random cases use random.Random(5451).

[[probe]]
name = "fdp-count"
question = "fdp.repeatN d, a, b: how many terms, and which registers it writes"
source = "dump.s"
params = { A = 0x3f800000, B = 0x40000000, C = 0x40800000, D = 0x41000000, E = 0x3f800000, F = 0x41800000, G = 0x43800000, H = 0x45800000, OUT = "r13" }
inputs = ["OP"]
cases = [["fdp r10, r1, r5"], ["fdp.repeat2 r10, r1, r5"], ["fdp.repeat3 r10, r1, r5"], ["fdp.repeat4 r10, r1, r5"]]
[probe.hypotheses]
"the N-term dot product, written to d + N - 1 only" = [[0x3f800000, 0xa4a5a6a7, 0xa8a9aaab, 0xacadaeaf], [0xa0a1a2a3, 0x42040000, 0xa8a9aaab, 0xacadaeaf], [0xa0a1a2a3, 0xa4a5a6a7, 0x44842000, 0xacadaeaf], [0xa0a1a2a3, 0xa4a5a6a7, 0xa8a9aaab, 0x47042100]]
"the N-term dot product, written to d only" = [[0x3f800000, 0xa4a5a6a7, 0xa8a9aaab, 0xacadaeaf], [0x42040000, 0xa4a5a6a7, 0xa8a9aaab, 0xacadaeaf], [0x44842000, 0xa4a5a6a7, 0xa8a9aaab, 0xacadaeaf], [0x47042100, 0xa4a5a6a7, 0xa8a9aaab, 0xacadaeaf]]
"the running sums, written to d .. d + N - 1" = [[0x3f800000, 0xa4a5a6a7, 0xa8a9aaab, 0xacadaeaf], [0x3f800000, 0x42040000, 0xa8a9aaab, 0xacadaeaf], [0x3f800000, 0x42040000, 0x44842000, 0xacadaeaf], [0x3f800000, 0x42040000, 0x44842000, 0x47042100]]
"the products, written to d .. d + N - 1" = [[0x3f800000, 0xa4a5a6a7, 0xa8a9aaab, 0xacadaeaf], [0x3f800000, 0x42000000, 0xa8a9aaab, 0xacadaeaf], [0x3f800000, 0x42000000, 0x44800000, 0xacadaeaf], [0x3f800000, 0x42000000, 0x44800000, 0x47000000]]

