#
# Round 1 leftovers settled in round 2 of the ISA probes (2026-10-22): the result of min/max
# when every operand is a NaN, movmsk .smsk, statomic, and c10 to 16-bit unpacks (recorded).
# Generated once; the random cases use random.Random(5460).
[[probe]]
name = "minmax-allnan"
question = "fminmax/fmaxmin when both operands of a step are NaN"
source = "dump.s"
params = { A = 0, B = 0, C = 0, D = 0, E = 0, F = 0, G = 0, H = 0, OUT = "r10" }
inputs = ["OP", "A", "B", "C", "D", "E", "F", "G", "H"]
cases = [["fminmax r10, r1, r2, r3\nfmaxmin r11, r1, r2, r3\nfminmax r12, r2, r1, r4\nfmaxmin r13, r4, r5, r6\nfminmax r14, r5, r5, r5\nfmaxmin r15, r6, r6, r6\nfminmax r16, r1, r2, r7\nfmaxmin r17, r7, r2, r3", 0x7fc00000, 0x7fa00001, 0xffc00000, 0x7fffffff, 0xff800001, 0x7f800001, 0, 0]]
[probe.hypotheses]
"the second operand, payload kept" = [[0xffc00000, 0x7fa00001, 0x7fffffff, 0xff800001, 0xff800001, 0x7f800001, 0, 0]]
"the first operand" = [[0x7fc00000, 0x7fc00000, 0x7fa00001, 0x7fffffff, 0xff800001, 0x7f800001, 0, 0]]
"the NaN 0x7fffffff" = [[0x7fffffff, 0x7fffffff, 0x7fffffff, 0x7fffffff, 0x7fffffff, 0x7fffffff, 0, 0]]

