#
# Bank 7 past i3. Round 4 of the ISA probes (2026-10-22). As gpiext.toml: coordinates in, every
# pixel read back; each pixel sets i0, i1, i2 to its marks k = 0, 1, 2 (coords.s).

[[probe]]
name = "internal-registers-bank7"
question = "what i4-i127 read and where a write to i4-i7 goes"
source = "coords.s"
coords = true
pixels = true
params = {  }
inputs = ["PRE", "OP", "OUT"]
labels = ["read i3", "read i4", "read i5", "read i6", "read i7", "read i8", "read i9", "read i10", "read i11", "read i12", "read i13", "read i14", "read i15", "read i16", "read i31", "read i63", "read i127", "write i4, read i0", "write i4, read i1", "write i4, read i2", "write i5, read i0", "write i5, read i1", "write i5, read i2", "write i6, read i0", "write i6, read i1", "write i6, read i2", "write i7, read i0", "write i7, read i1", "write i7, read i2"]
