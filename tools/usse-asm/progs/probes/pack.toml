#
# Pack and unpack (pck*, unpck*). Round 1 of the ISA probes (2026-10-22). Generated once;
# the random cases use random.Random(5453).

[[probe]]
name = "pack-u8-bytemask"
question = "pcku8f32 d.bytemaskXXXX, s1, s2: which bytes take s1 and s2 (s1 = 1, s2 = 2)"
source = "dump.s"
params = { A = 0x3f800000, B = 0x40000000, C = 0, D = 0, E = 0, F = 0, G = 0, H = 0, OUT = "r10" }
