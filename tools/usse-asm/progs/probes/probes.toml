"saturates at 0, upper zeroed" = [0, 0, 4]
"wraps, upper kept" = [0x0000ffff, 0x0001ffff, 4]
"saturates at 0, upper kept" = [0, 0x00010000, 4]
"32-bit subtract" = [0xffffffff, 0x0000ffff, 4]
"both lanes minus 1, wrapping" = [0xffffffff, 0x0000ffff, 0xffff0004]

[[probe]]
name = "isubu16-zero"
question = "isubu16.testtaz predicate when 0 - 1 (saturation gives z)"
source = "pred.s"
