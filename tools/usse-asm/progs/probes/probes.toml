# ---- loads and stores with a register offset (scratch + 0x8000, dword 0x2000) --------------
# The offset register reads as two 16-bit halves; the hypotheses: the offset is their
# product in bytes (the firmware ORs 0x00040000 into a dword index), unsigned or signed.

[[probe]]
name = "ldad-reg-off"
question = "ldad r30, [r1,+r2]: the offset in bytes is (r2 >> 16) * (r2 & 0xffff)?"
source = "memoff.s"
params = { OP = "ldad r30, [r1,+r2], drc0", OUT = "r30" }
inputs = ["O"]
cases = [[0], [1], [2], [0x40000], [0x40001], [0x40002], [0x40003], [0x20002], [0x10001], [0x30001], [0x10000], [0x80004], [0x200001], [0x01000001], [0x00011000], [0x0000ffff]]
[probe.hypotheses]
"bytes = high * low" = [0xd0002000, 0xd0002000, 0xd0002000, 0xd0002000, 0xd0002001, 0xd0002002, 0xd0002003, 0xd0002001, 0x01d00020, 0x002001d0, 0xd0002000, 0xd0002008, 0xd0002008, 0xd0002040, 0xd0002400, 0xd0002000]

[[probe]]
name = "ldad-reg-off-sign"
question = "ldad r30, [r1,+r2] with the top bit of a half set: signed or unsigned halves"
source = "memoff.s"
params = { OP = "ldad r30, [r1,+r2], drc0", OUT = "r30" }
inputs = ["O"]
cases = [[0x0004ffff], [0xffff0001], [0xfffc0001], [0x0001f000], [0xf0000001], [0x80000001], [0x00018000], [0xffffffff], [0xfffcfffe]]
[probe.hypotheses]
"signed halves" = [0xd0001fff, 0x002000d0, 0xd0001fff, 0xd0001c00, 0xd0001c00, 0xd0000000, 0xd0000000, 0x01d00020, 0xd0002002]
"low half signed, high unsigned" = [0xd0001fff, { o0_not = 0x002000d0 }, { o0_not = 0xd0001fff }, 0xd0001c00, { o0_not = 0xd0001c00 }, { o0_not = 0xd0000000 }, 0xd0000000, { o0_not = 0x01d00020 }, { o0_not = 0xd0002002 }]
"unsigned halves (every case outside the buffer)" = ["fail", "fail", "fail", "fail", "fail", "fail", "fail", "fail", "fail"]
"high half signed, low unsigned" = [{ o0_not = 0xd0001fff }, 0x002000d0, 0xd0001fff, { o0_not = 0xd0001c00 }, 0xd0001c00, 0xd0000000, { o0_not = 0xd0000000 }, { o0_not = 0x01d00020 }, { o0_not = 0xd0002002 }]

[[probe]]
name = "ldad-reg-off-neg"
