# ---- index registers -----------------------------------------------------------------------

[[probe]]
name = "index-unit"
question = "r[il + #n]: the unit of i.l, its origin and the role of #n"
source = "index.s"
params = { OP = "mov r30, r[il + #{N}]", OUT = "r30" }
inputs = ["K", "N"]
cases = [[0, "0"], [1, "0"], [2, "0"], [3, "0"], [0, "1"], [1, "1"], [2, "3"]]
[probe.hypotheses]
"one register, from r0, + n" = [0xa0, 0xa1, 0xa2, 0xa3, 0xa1, 0xa2, 0xa5]
"pairs, from r0, + n" = [0xa0, 0xa2, 0xa4, 0xa6, 0xa1, 0xa3, 0xa7]
"four registers, from r0, + n" = [0xa0, 0xa4, 0xa8, 0xac, 0xa1, 0xa5, 0xab]
"bytes, from r0, + n" = [0xa0, 0xa0, 0xa0, 0xa0, 0xa1, 0xa1, 0xa3]

[[probe]]
name = "index-width"
question = "which bits of i.l count: indexes past the instance's temporaries (mixed: the next instances' r1 = 0xa1)"
source = "index.s"
params = { OP = "mov r30, r[il + #0]", OUT = "r30" }
inputs = ["K"]
cases = [[0x40001], [0x10001], [0x00101], [0x00081], [0x00041], [0x00021], [0x80000001]]
[[probe]]
name = "index-store"
question = "mov r[il + #n], r21: does the store form mirror the load (read r1 back)"
source = "index.s"
params = { OP = "mov r[il + #{N}], r21", OUT = "r1" }
inputs = ["K", "N"]
cases = [[1, "0"], [0, "1"], [0x40001, "0"], [2, "0"]]
[probe.hypotheses]
"one register, from r0, + n; bit 18 ignored" = [0x5555aaaa, 0x5555aaaa, 0x5555aaaa, 0xa1]
"one register, from r0, + n; bit 18 counts" = [0x5555aaaa, 0x5555aaaa, 0xa1, 0xa1]

[[probe]]
name = "sa-values"
question = "what the fill's secondary attributes hold (control for index-sa)"
source = "value.s"
params = { OP = "nop", A = 0, B = 0, C = 0, D = 0 }
inputs = ["OUT"]
cases = [["sa0"], ["sa1"], ["sa2"], ["sa3"]]

