#
# Hardware probes of the USSE instruction set (tools/usse-asm/probe.py; the questions come
# from tools/usse-dis/r2/README.md, "Probes for the next hardware session").
#
# Each [[probe]]: a template in this directory, `params` substituted into it, `inputs` named
# per case (an integer is written as 0x%08X, a string verbatim) and, per hypothesis, the
# readback of every case: an integer (o0), "fail" (the job faulted or hung), or a table with
# "o0", "o0_not", "most" (at least 90% of the pixels) and/or "scratch" ({"0xOFF" = value}, the exact set of changed dwords of the
# 64 KiB scratch buffer, whose dword i starts as 0xD0000000 | i). Results go to
# tools/usse-dis/r2/README.md with [HW] tags.

# ---- the test group: sign tests and joins ------------------------------------------------

[[probe]]
name = "sign-p-shl"
question = "test sign p: > 0 or >= 0 (shl by 0, as the firmware's shl.testpat)"
source = "pred.s"
params = { OP = "shl.testpat.chan0 !c0, p0, r1, #0", P = "p0", B = 0, C = 0 }
inputs = ["A"]
cases = [[0], [1], [0x80000000], [0x7fffffff]]
[probe.hypotheses]
">= 0" = [1, 1, 0, 1]
"> 0" = [0, 1, 0, 1]

[[probe]]
name = "sign-p-and"
question = "test sign p on the bitwise group (and r1, r1)"
source = "pred.s"
params = { OP = "and.testpat.chan0 !c0, p0, r1, r1", P = "p0", B = 0, C = 0 }
inputs = ["A"]
cases = [[0], [1], [0x80000000]]
[probe.hypotheses]
">= 0" = [1, 1, 0]
"> 0" = [0, 1, 0]

[[probe]]
name = "join-t-not"
question = "t in an o join (testnot: n or t): t = true, or no term"
source = "pred.s"
params = { OP = "and.testnot.chan0 !c0, p0, r1, r1", P = "p0", B = 0, C = 0 }
inputs = ["A"]
cases = [[1], [0x80000000], [0]]
[probe.hypotheses]
"t is true" = [1, 1, 1]
"t is no term" = [0, 1, 0]

[[probe]]
name = "join-t-toz"
question = "t in an o join (testtoz: t or z)"
source = "pred.s"
params = { OP = "and.testtoz.chan0 !c0, p0, r1, r1", P = "p0", B = 0, C = 0 }
inputs = ["A"]
cases = [[1], [0]]
[probe.hypotheses]
"t is true" = [1, 1]
"t is no term" = [0, 1]

[[probe]]
name = "join-t-tonz"
question = "t in an o join (testtonz: t or nz)"
source = "pred.s"
params = { OP = "and.testtonz.chan0 !c0, p0, r1, r1", P = "p0", B = 0, C = 0 }
inputs = ["A"]
cases = [[0], [1]]
[probe.hypotheses]
"t is true" = [1, 1]
"t is no term" = [0, 1]

[[probe]]
name = "sign-n-iadd32"
question = "sign test n of iadd32: bit 31 of the result, the exact sign or the carry"
source = "pred.s"
params = { OP = "iadd32.testnat.chan0 !c0, p0, r1, r2", P = "p0", C = 0 }
inputs = ["A", "B"]
cases = [[0x7fffffff, 1], [0xffffffff, 1], [0x80000000, 0xffffffff], [0xfffffffe, 1]]
[probe.hypotheses]
"bit 31 of r1 + r2" = [1, 0, 0, 1]
"bit 31 of sext16(r1) + r2" = [0, 0, 1, 1]
"carry out" = [0, 1, 1, 0]

[[probe]]
name = "sign-n-iaddu32"
question = "sign test n of iaddu32"
source = "pred.s"
params = { OP = "iaddu32.testnat.chan0 !c0, p0, r1, r2", P = "p0", C = 0 }
inputs = ["A", "B"]
cases = [[0x7fffffff, 1], [0xffffffff, 1], [0x80000000, 0xffffffff], [0xfffffffe, 1]]
[probe.hypotheses]
"bit 31 of r1 + r2" = [1, 0, 0, 1]
"carry out" = [0, 1, 1, 0]
"unsigned: n never" = [0, 0, 0, 0]

[[probe]]
name = "zero-z-iadd32"
question = "zero test of iadd32 (control: modelled as the 32-bit result being 0)"
source = "pred.s"
params = { OP = "iadd32.testtaz.chan0 !c0, p0, r1, r2", P = "p0", C = 0 }
inputs = ["A", "B"]
cases = [[0xffffffff, 1], [0x00010000, 0], [5, 0xfffffffb], [1, 1]]
[probe.hypotheses]
"r1 + r2 is 0" = [1, 0, 1, 0]
"sext16(r1) + r2 is 0" = [1, 1, 1, 0]

# ---- 16-bit integer ops --------------------------------------------------------------------

[[probe]]
name = "isub16-value"
question = "isub16 r4 = r1 - #1: lanes, upper half, saturation"
source = "value.s"
params = { OP = "isub16.testtaz.chan0 r4, p0, r1, #1", OUT = "r4", B = 0, C = 0, D = 0x5A5A5A5A }
inputs = ["A"]
cases = [[0x00010001], [0], [0x00018000], [0x00020000], [0x12340005], [1]]
[probe.hypotheses]
"low lane wraps, upper kept" = [0x00010000, 0x0000ffff, 0x00017fff, 0x0002ffff, 0x12340004, 0]
"low lane wraps, upper zeroed" = [0, 0xffff, 0x7fff, 0xffff, 4, 0]
"low lane wraps, sign-extended" = [0, 0xffffffff, 0x7fff, 0xffffffff, 4, 0]
"32-bit subtract" = [0x00010000, 0xffffffff, 0x00017fff, 0x0001ffff, 0x12340004, 0]
"low lane saturates, upper zeroed" = [0, 0xffff, 0x8000, 0xffff, 4, 0]
"low lane saturates, sign-extended" = [0, 0xffffffff, 0xffff8000, 0xffffffff, 4, 0]
"both lanes minus 1, wrapping" = [0, 0xffffffff, 0x00007fff, 0x0001ffff, 0x12330004, 0xffff0000]

[[probe]]
name = "isub16-zero"
question = "isub16.testtaz: is z taken from 16 or 32 bits"
source = "pred.s"
params = { OP = "isub16.testtaz.chan0 r4, p0, r1, #1", P = "p0", B = 0, C = 0 }
inputs = ["A"]
cases = [[0x00010001], [0], [0x00018000], [0x00020000], [0x12340005], [1]]
[probe.hypotheses]
"low 16 bits are 0" = [1, 0, 0, 0, 0, 1]
"32-bit difference is 0" = [0, 0, 0, 0, 0, 1]

[[probe]]
name = "isub16-sign-n"
question = "isub16 sign test n: bit 15 or bit 31"
source = "pred.s"
params = { OP = "isub16.testnat.chan0 !c0, p0, r1, #0", P = "p0", B = 0, C = 0 }
inputs = ["A"]
cases = [[0x00008000], [0x80000000], [0x00007fff], [0xffff0000]]
[probe.hypotheses]
"bit 15" = [1, 0, 0, 0]
"bit 31" = [0, 1, 0, 1]

[[probe]]
name = "isub16-sign-p"
question = "isub16 sign test p: > 0 or >= 0, on 16 or 32 bits"
source = "pred.s"
params = { OP = "isub16.testpat.chan0 !c0, p0, r1, #0", P = "p0", B = 0, C = 0 }
inputs = ["A"]
cases = [[0], [1], [0x8000], [0x10000]]
[probe.hypotheses]
">= 0 on 16 bits" = [1, 1, 0, 1]
"> 0 on 16 bits" = [0, 1, 0, 0]
">= 0 on 32 bits" = [1, 1, 1, 1]
"> 0 on 32 bits" = [0, 1, 1, 1]

[[probe]]
name = "isub16-reg"
question = "isub16 between registers (the firmware's isub16.testpat r8, r1): r4 = r1 - r2"
source = "value.s"
params = { OP = "isub16.testtaz.chan0 r4, p0, r1, r2", OUT = "r4", C = 0, D = 0x5A5A5A5A }
inputs = ["A", "B"]
cases = [[0x00050007, 0x00010002], [0x00000001, 0x00000002], [0x00030000, 0x00010000]]
[probe.hypotheses]
"low lane wraps, upper zeroed" = [5, 0xffff, 0]
"low lane wraps, upper of r1 kept" = [0x00050005, 0x0000ffff, 0x00030000]
"32-bit subtract" = [0x00040005, 0xffffffff, 0x00020000]
"both lanes" = [0x00040005, 0x0000ffff, 0x00020000]
"low lane wraps, sign-extended" = [5, 0xffffffff, 0]

[[probe]]
name = "isubu16-value"
question = "isubu16 r4 = r1 - #1: wraps or saturates"
source = "value.s"
params = { OP = "isubu16.testtaz.chan0 r4, p0, r1, #1", OUT = "r4", B = 0, C = 0, D = 0x5A5A5A5A }
