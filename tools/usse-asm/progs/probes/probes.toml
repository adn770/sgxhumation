# ---- shifts by a register ----------------------------------------------------------------

[[probe]]
name = "shl-reg"
question = "shl by a register amount of 32 and over"
source = "value.s"
params = { OP = "shl r4, r1, r2", OUT = "r4", A = 0x80000001, C = 0, D = 0 }
inputs = ["B"]
cases = [[1], [31], [32], [33], [64], [0xffffffff], [0x100]]
[probe.hypotheses]
"amount mod 32" = [2, 0x80000000, 0x80000001, 2, 0x80000001, 0x80000000, 0x80000001]
"amount mod 64, 32-63 give 0" = [2, 0x80000000, 0, 0, 0x80000001, 0, 0x80000001]
"32 and over give 0" = [2, 0x80000000, 0, 0, 0, 0, 0]
"low 8 bits, 32 and over give 0" = [2, 0x80000000, 0, 0, 0, 0, 0x80000001]

[[probe]]
name = "shr-reg"
question = "shr by a register amount of 32 and over"
source = "value.s"
params = { OP = "shr r4, r1, r2", OUT = "r4", A = 0x80000001, C = 0, D = 0 }
inputs = ["B"]
cases = [[1], [31], [32], [33], [64], [0xffffffff], [0x100]]
[probe.hypotheses]
"amount mod 32" = [0x40000000, 1, 0x80000001, 0x40000000, 0x80000001, 1, 0x80000001]
"amount mod 64, 32-63 give 0" = [0x40000000, 1, 0, 0, 0x80000001, 0, 0x80000001]
"32 and over give 0" = [0x40000000, 1, 0, 0, 0, 0, 0]
"low 8 bits, 32 and over give 0" = [0x40000000, 1, 0, 0, 0, 0, 0x80000001]

[[probe]]
name = "asr-reg"
question = "asr by a register amount of 32 and over"
source = "value.s"
params = { OP = "asr r4, r1, r2", OUT = "r4", A = 0x80000001, C = 0, D = 0 }
inputs = ["B"]
cases = [[1], [31], [32], [33], [64], [0xffffffff], [0x100]]
[probe.hypotheses]
"amount mod 32" = [0xc0000000, 0xffffffff, 0x80000001, 0xc0000000, 0x80000001, 0xffffffff, 0x80000001]
"amount mod 64, 32-63 fill the sign" = [0xc0000000, 0xffffffff, 0xffffffff, 0xffffffff, 0x80000001, 0xffffffff, 0x80000001]
"32 and over fill the sign" = [0xc0000000, 0xffffffff, 0xffffffff, 0xffffffff, 0xffffffff, 0xffffffff, 0xffffffff]
"low 8 bits, 32 and over fill the sign" = [0xc0000000, 0xffffffff, 0xffffffff, 0xffffffff, 0xffffffff, 0xffffffff, 0x80000001]

[[probe]]
name = "rol-reg"
question = "rol by a register amount of 32 and over"
source = "value.s"
params = { OP = "rol r4, r1, r2", OUT = "r4", A = 0x80000001, C = 0, D = 0 }
inputs = ["B"]
cases = [[1], [31], [32], [33], [64], [0xffffffff], [0x100]]
[probe.hypotheses]
"amount mod 32" = [3, 0xc0000000, 0x80000001, 3, 0x80000001, 0xc0000000, 0x80000001]

[[probe]]
name = "shl-test-reg"
question = "shl.testnat by a register amount of 32 and over (the test group)"
source = "value.s"
params = { OP = "shl.testnat.chan0 r4, p0, r1, r2", OUT = "r4", A = 0x80000001, C = 0, D = 0 }
inputs = ["B"]
cases = [[1], [31], [32], [33]]
[probe.hypotheses]
