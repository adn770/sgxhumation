#
# Internal registers per pixel and efo.gpiext. Round 3 of the ISA probes (2026-10-22). Every
# case runs on coordinates (coords.s: pa0 = (y << 16) | x) and reads every pixel back; each
# pixel p sets i0, i1, i2 to (2048 + p) * 2^(12k), k = 0, 1, 2, so a result names both the
# register and the pixel it came from. Quad positions: TL (even x, even y), TR, BL, BR.

[[probe]]
name = "internal-registers-per-pixel"
question = "i0-i2 per pixel; which instance's register i3 reads; where a write to i3 goes"
source = "coords.s"
coords = true
pixels = true
params = {  }
inputs = ["PRE", "OP", "OUT"]
labels = ["read i0", "read i1", "read i2", "read i3", "write i3, read i0", "write i3, read i3"]
cases = [["mov i0, r3\nmov i1, r4\nmov i2, r5", "mov r10, i0", "r10"], ["mov i0, r3\nmov i1, r4\nmov i2, r5", "mov r10, i1", "r10"], ["mov i0, r3\nmov i1, r4\nmov i2, r5", "mov r10, i2", "r10"], ["mov i0, r3\nmov i1, r4\nmov i2, r5", "mov r10, i3", "r10"], ["mov i0, r3\nmov i1, r4\nmov i2, r5", "mov i3, r6\nmov r10, i0", "r10"], ["mov i0, r3\nmov i1, r4\nmov i2, r5", "mov i3, r6\nmov r10, i3", "r10"]]
[probe.hypotheses]
"per-instance i0-i2; i3 reads the next instance's i0 in the quad (TL, TR, BL, BR, TL); a write to i3 is dropped" = [{ quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[1, 0], [1, 1], [1, 2], [1, 3]] }, { quad = [[2, 0], [2, 1], [2, 2], [2, 3]] }, { quad = [[0, 1], [0, 2], [0, 3], [0, 0]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[0, 1], [0, 2], [0, 3], [0, 0]] }]
"i3 reads the previous instance's i0 in the quad; a write to i3 is dropped" = [{ quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[1, 0], [1, 1], [1, 2], [1, 3]] }, { quad = [[2, 0], [2, 1], [2, 2], [2, 3]] }, { quad = [[0, 3], [0, 0], [0, 1], [0, 2]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[0, 3], [0, 0], [0, 1], [0, 2]] }]
"i3 reads the instance's own i0 (round 1); a write to i3 is dropped" = [{ quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[1, 0], [1, 1], [1, 2], [1, 3]] }, { quad = [[2, 0], [2, 1], [2, 2], [2, 3]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }]
"i3 reads the horizontal neighbour's i0 (x ^ 1); a write to i3 is dropped" = [{ quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[1, 0], [1, 1], [1, 2], [1, 3]] }, { quad = [[2, 0], [2, 1], [2, 2], [2, 3]] }, { quad = [[0, 1], [0, 0], [0, 3], [0, 2]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[0, 1], [0, 0], [0, 3], [0, 2]] }]
"i3 is the next instance's i0, also for writes" = [{ quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[1, 0], [1, 1], [1, 2], [1, 3]] }, { quad = [[2, 0], [2, 1], [2, 2], [2, 3]] }, { quad = [[0, 1], [0, 2], [0, 3], [0, 0]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[3, 1], [3, 2], [3, 3], [3, 0]] }]

[[probe]]
name = "efo-gpiext-quad"
question = "efo.gpiext: whose internal registers each pixel reads and writes (2x2 quads)"
source = "coords.s"
coords = true
pixels = true
params = {  }
inputs = ["PRE", "OP", "OUT"]
labels = ["no write: m0 = 1.0 * i0", "no write: m1 = 1.0 * i1", "no write: d = i0", "no write: d = i1", "after writing i1 (k4): read i0", "after writing i1 (k4): read i1", "after writing i1 (k4): read i3", "after writing i0 (k3): read i2", "after writing i0 (k3): read i0"]
cases = [["mov i0, r3\nmov i1, r4\nmov i2, r5", "efo.gpiext r10= a0, !i0 = a0, !i1 = a1, a0=m0+src0, a1=i1+i0, m0=src1*i0, m1=src2*i1, r7, r8, r8", "r10"], ["mov i0, r3\nmov i1, r4\nmov i2, r5", "efo.gpiext r10= a0, !i0 = a0, !i1 = a1, a0=m0+m1, a1=i1+i0, m0=src1*i0, m1=src2*i1, r7, r7, r8", "r10"], ["mov i0, r3\nmov i1, r4\nmov i2, r5", "efo.gpiext r10= i0, !i0 = a0, !i1 = a1, a0=m0+m1, a1=i1+i0, m0=src1*i0, m1=src2*i1, r7, r7, r8", "r10"], ["mov i0, r3\nmov i1, r4\nmov i2, r5", "efo.gpiext r10= i1, !i0 = a0, !i1 = a1, a0=m0+m1, a1=i1+i0, m0=src1*i0, m1=src2*i1, r7, r7, r8", "r10"], ["or.skipinv r9, r1, #0x5D000000\nmov i0, r3\nmov i1, r4\nmov i2, r5", "efo.gpiext r10= i1, !i0 = a0, i1 = m1, a0=m0+i0, a1=i1+m1, m0=src0*src2, m1=src1*src2, r7, r9, r8\nmov r10, i0", "r10"], ["or.skipinv r9, r1, #0x5D000000\nmov i0, r3\nmov i1, r4\nmov i2, r5", "efo.gpiext r10= i1, !i0 = a0, i1 = m1, a0=m0+i0, a1=i1+m1, m0=src0*src2, m1=src1*src2, r7, r9, r8\nmov r10, i1", "r10"], ["or.skipinv r9, r1, #0x5D000000\nmov i0, r3\nmov i1, r4\nmov i2, r5", "efo.gpiext r10= i1, !i0 = a0, i1 = m1, a0=m0+i0, a1=i1+m1, m0=src0*src2, m1=src1*src2, r7, r9, r8\nmov r10, i3", "r10"], ["mov i0, r3\nmov i1, r4\nmov i2, r5", "efo.gpiext r10= a1, i0 = a0, !i1 = a1, a0=src0+src2 a1=src1+src2, m0=src0*src2, m1=src1*src2, r6, r7, r7\nmov r10, i2", "r10"], ["mov i0, r3\nmov i1, r4\nmov i2, r5", "efo.gpiext r10= a1, i0 = a0, !i1 = a1, a0=src0+src2 a1=src1+src2, m0=src0*src2, m1=src1*src2, r6, r7, r7\nmov r10, i0", "r10"]]
[probe.hypotheses]
"multipliers read i2 for i0 and i0 for i1; writes of i0 go to i2; a quad's i1 writes end in TR's i0, BR's last" = [{ quad = [[2, 0], [2, 1], [2, 2], [2, 3]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[1, 0], [1, 1], [1, 2], [1, 3]] }, { quad = [[0, 0], [4, 3], [0, 2], [0, 3]] }, { quad = [[1, 0], [1, 1], [1, 2], [1, 3]] }, { quad = [[4, 3], [0, 2], [0, 3], [0, 0]] }, { quad = [[3, 0], [3, 1], [3, 2], [3, 3]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }]
".gpiext changes nothing" = [{ quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[1, 0], [1, 1], [1, 2], [1, 3]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[1, 0], [1, 1], [1, 2], [1, 3]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[4, 0], [4, 1], [4, 2], [4, 3]] }, { quad = [[0, 1], [0, 2], [0, 3], [0, 0]] }, { quad = [[2, 0], [2, 1], [2, 2], [2, 3]] }, { quad = [[3, 0], [3, 1], [3, 2], [3, 3]] }]
"round 2: multipliers read i2/i0, writes go to i2, the i1 write is dropped, registers private" = [{ quad = [[2, 0], [2, 1], [2, 2], [2, 3]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[1, 0], [1, 1], [1, 2], [1, 3]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[1, 0], [1, 1], [1, 2], [1, 3]] }, { quad = [[0, 1], [0, 2], [0, 3], [0, 0]] }, { quad = [[3, 0], [3, 1], [3, 2], [3, 3]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }]
"the i1 write goes to i3, the next instance's i0" = [{ quad = [[2, 0], [2, 1], [2, 2], [2, 3]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }, { quad = [[1, 0], [1, 1], [1, 2], [1, 3]] }, { quad = [[4, 3], [4, 0], [4, 1], [4, 2]] }, { quad = [[1, 0], [1, 1], [1, 2], [1, 3]] }, { quad = [[4, 0], [4, 1], [4, 2], [4, 3]] }, { quad = [[3, 0], [3, 1], [3, 2], [3, 3]] }, { quad = [[0, 0], [0, 1], [0, 2], [0, 3]] }]

[[probe]]
name = "efo-gpiext-race"
question = "efo.gpiext writing i1: TR reads TL's i0, and now and then TL's i1 write (recorded)"
source = "coords.s"
coords = true
pixels = true
params = {  }
inputs = ["PRE", "OP", "OUT"]
labels = ["writing i1 (k4): d = i0", "writing i1 (k4): a0 = 0 + i0"]
cases = [["or.skipinv r9, r1, #0x5D000000\nmov i0, r3\nmov i1, r4\nmov i2, r5", "efo.gpiext r10= i0, !i0 = a0, i1 = m1, a0=m0+i0, a1=i1+m1, m0=src0*src2, m1=src1*src2, r7, r9, r8", "r10"], ["or.skipinv r9, r1, #0x5D000000\nmov i0, r3\nmov i1, r4\nmov i2, r5", "efo.gpiext r10= a0, !i0 = a0, i1 = m1, a0=m0+i0, a1=i1+m1, m0=src0*src2, m1=src1*src2, r7, r9, r8", "r10"]]

[[probe]]
name = "internal-registers-across-tasks"
question = "which pixel's i0 the next task's pixels see (recorded: quads move whole, positions kept)"
source = "coords.s"
coords = true
pixels = true
params = {  }
inputs = ["PRE", "OP", "OUT"]
labels = ["task A sets i0-i2 (k3, k4, k0)", "task B reads i0 unwritten", "task A again", "task B reads i3 unwritten"]
cases = [["or.skipinv r9, r1, #0x5D000000\nmov i0, r6\nmov i1, r9\nmov i2, r3", "mov r10, i0", "r10"], ["", "mov r10, i0", "r10"], ["or.skipinv r9, r1, #0x5D000000\nmov i0, r6\nmov i1, r9\nmov i2, r3", "mov r10, i0", "r10"], ["", "mov r10, i3", "r10"]]
