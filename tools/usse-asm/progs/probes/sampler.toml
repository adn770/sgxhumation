#
# Sampler state. Round 4 of the ISA probes (2026-10-22). As smp.toml: r20-r23 hold the four
# texture state words, the texture is the scratch buffer + 0x1000 (dword i = 0xD0000400 + i),
# r24/r25 the normalized coordinates, r26 on what a LOD mode or PCF reads. The stride texture
# is libsgxfive's copy source (T1 type 6, 64-byte rows); "twiddled" is T1 type 0 with T0
# bits 20:17 = 15. T0 bits 13:12 are the magnification filter, 8:6/5:3 the U/V address mode;
# T1 bits 28:24 the format; T3 bits 31:29 the compare mode, 17:16 the conversion, 15 the
# normalization.

