#
# Cache control. Round 3 of the ISA probes (2026-10-22). Every pixel has its own dword in the
# scratch buffer (+0x4000 + 4p): it stores mark 4, reads it back, stores mark 3, runs the
# cache operation (r20, r21: the buffer and its own address) and loads its dword again.

[[probe]]
name = "cache-control"
question = "ci/cf/cfi on every level, .global, .dm_nomatch: what a load after them sees"
source = "coords.s"
coords = true
pixels = true
params = {  }
inputs = ["PRE", "OP", "OUT"]
labels = ["ci r20, r21, #1", "ci r20, r21, #2", "ci r20, r21, #3", "cf r20, r21, #1", "cf r20, r21, #3", "cfi r20, r21, #3", "ci.global r20, r21, #3", "cf.global r20, r21, #3", "cfi.global r20, r21, #3", "ci.dm_nomatch r20, r21, #3"]
cases = [["or.skipinv r9, r1, #0x5D000000\nshr.skipinv r21, r1, #12\nmov r20, #0x5CAF4000\nimae.u r21, r21.low, #4.low, r20, u32\nstad [r21,+#0], r9\nidf drc0, bif\nwdf drc0\nldad r11, [r21,+#0], drc0\nwdf drc0", "stad [r21,+#0], r6\nci r20, r21, #1\nldad r10, [r21,+#0], drc0\nwdf drc0", "r10"], ["or.skipinv r9, r1, #0x5D000000\nshr.skipinv r21, r1, #12\nmov r20, #0x5CAF4000\nimae.u r21, r21.low, #4.low, r20, u32\nstad [r21,+#0], r9\nidf drc0, bif\nwdf drc0\nldad r11, [r21,+#0], drc0\nwdf drc0", "stad [r21,+#0], r6\nci r20, r21, #2\nldad r10, [r21,+#0], drc0\nwdf drc0", "r10"], ["or.skipinv r9, r1, #0x5D000000\nshr.skipinv r21, r1, #12\nmov r20, #0x5CAF4000\nimae.u r21, r21.low, #4.low, r20, u32\nstad [r21,+#0], r9\nidf drc0, bif\nwdf drc0\nldad r11, [r21,+#0], drc0\nwdf drc0", "stad [r21,+#0], r6\nci r20, r21, #3\nldad r10, [r21,+#0], drc0\nwdf drc0", "r10"], ["or.skipinv r9, r1, #0x5D000000\nshr.skipinv r21, r1, #12\nmov r20, #0x5CAF4000\nimae.u r21, r21.low, #4.low, r20, u32\nstad [r21,+#0], r9\nidf drc0, bif\nwdf drc0\nldad r11, [r21,+#0], drc0\nwdf drc0", "stad [r21,+#0], r6\ncf r20, r21, #1\nldad r10, [r21,+#0], drc0\nwdf drc0", "r10"], ["or.skipinv r9, r1, #0x5D000000\nshr.skipinv r21, r1, #12\nmov r20, #0x5CAF4000\nimae.u r21, r21.low, #4.low, r20, u32\nstad [r21,+#0], r9\nidf drc0, bif\nwdf drc0\nldad r11, [r21,+#0], drc0\nwdf drc0", "stad [r21,+#0], r6\ncf r20, r21, #3\nldad r10, [r21,+#0], drc0\nwdf drc0", "r10"], ["or.skipinv r9, r1, #0x5D000000\nshr.skipinv r21, r1, #12\nmov r20, #0x5CAF4000\nimae.u r21, r21.low, #4.low, r20, u32\nstad [r21,+#0], r9\nidf drc0, bif\nwdf drc0\nldad r11, [r21,+#0], drc0\nwdf drc0", "stad [r21,+#0], r6\ncfi r20, r21, #3\nldad r10, [r21,+#0], drc0\nwdf drc0", "r10"], ["or.skipinv r9, r1, #0x5D000000\nshr.skipinv r21, r1, #12\nmov r20, #0x5CAF4000\nimae.u r21, r21.low, #4.low, r20, u32\nstad [r21,+#0], r9\nidf drc0, bif\nwdf drc0\nldad r11, [r21,+#0], drc0\nwdf drc0", "stad [r21,+#0], r6\nci.global r20, r21, #3\nldad r10, [r21,+#0], drc0\nwdf drc0", "r10"], ["or.skipinv r9, r1, #0x5D000000\nshr.skipinv r21, r1, #12\nmov r20, #0x5CAF4000\nimae.u r21, r21.low, #4.low, r20, u32\nstad [r21,+#0], r9\nidf drc0, bif\nwdf drc0\nldad r11, [r21,+#0], drc0\nwdf drc0", "stad [r21,+#0], r6\ncf.global r20, r21, #3\nldad r10, [r21,+#0], drc0\nwdf drc0", "r10"], ["or.skipinv r9, r1, #0x5D000000\nshr.skipinv r21, r1, #12\nmov r20, #0x5CAF4000\nimae.u r21, r21.low, #4.low, r20, u32\nstad [r21,+#0], r9\nidf drc0, bif\nwdf drc0\nldad r11, [r21,+#0], drc0\nwdf drc0", "stad [r21,+#0], r6\ncfi.global r20, r21, #3\nldad r10, [r21,+#0], drc0\nwdf drc0", "r10"], ["or.skipinv r9, r1, #0x5D000000\nshr.skipinv r21, r1, #12\nmov r20, #0x5CAF4000\nimae.u r21, r21.low, #4.low, r20, u32\nstad [r21,+#0], r9\nidf drc0, bif\nwdf drc0\nldad r11, [r21,+#0], drc0\nwdf drc0", "stad [r21,+#0], r6\nci.dm_nomatch r20, r21, #3\nldad r10, [r21,+#0], drc0\nwdf drc0", "r10"]]
[probe.hypotheses]
"no visible effect: the load after the cache operation returns the pixel's own store" = [{ quad = [[3, 0], [3, 1], [3, 2], [3, 3]] }, { quad = [[3, 0], [3, 1], [3, 2], [3, 3]] }, { quad = [[3, 0], [3, 1], [3, 2], [3, 3]] }, { quad = [[3, 0], [3, 1], [3, 2], [3, 3]] }, { quad = [[3, 0], [3, 1], [3, 2], [3, 3]] }, { quad = [[3, 0], [3, 1], [3, 2], [3, 3]] }, { quad = [[3, 0], [3, 1], [3, 2], [3, 3]] }, { quad = [[3, 0], [3, 1], [3, 2], [3, 3]] }, { quad = [[3, 0], [3, 1], [3, 2], [3, 3]] }, { quad = [[3, 0], [3, 1], [3, 2], [3, 3]] }]
"the invalidates drop the store: the load returns the earlier value" = [{ quad = [[4, 0], [4, 1], [4, 2], [4, 3]] }, { quad = [[4, 0], [4, 1], [4, 2], [4, 3]] }, { quad = [[4, 0], [4, 1], [4, 2], [4, 3]] }, { quad = [[3, 0], [3, 1], [3, 2], [3, 3]] }, { quad = [[3, 0], [3, 1], [3, 2], [3, 3]] }, { quad = [[3, 0], [3, 1], [3, 2], [3, 3]] }, { quad = [[4, 0], [4, 1], [4, 2], [4, 3]] }, { quad = [[3, 0], [3, 1], [3, 2], [3, 3]] }, { quad = [[3, 0], [3, 1], [3, 2], [3, 3]] }, { quad = [[4, 0], [4, 1], [4, 2], [4, 3]] }]
"every operation drops the store" = [{ quad = [[4, 0], [4, 1], [4, 2], [4, 3]] }, { quad = [[4, 0], [4, 1], [4, 2], [4, 3]] }, { quad = [[4, 0], [4, 1], [4, 2], [4, 3]] }, { quad = [[4, 0], [4, 1], [4, 2], [4, 3]] }, { quad = [[4, 0], [4, 1], [4, 2], [4, 3]] }, { quad = [[4, 0], [4, 1], [4, 2], [4, 3]] }, { quad = [[4, 0], [4, 1], [4, 2], [4, 3]] }, { quad = [[4, 0], [4, 1], [4, 2], [4, 3]] }, { quad = [[4, 0], [4, 1], [4, 2], [4, 3]] }, { quad = [[4, 0], [4, 1], [4, 2], [4, 3]] }]
