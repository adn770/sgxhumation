mask = "CLSM | m(54, 53) | m(42, 39)"
val = "cls(5) | b(53) | m(42, 39)"
fields = [
    "PRED_ALL 58:56", "MSC_C5FLAGS", "REPEAT 47:44", "F_DST", "F_MSRC0", "F_SRC1D", "F_SRC2D",
    "MSC_COMP 38:37",
